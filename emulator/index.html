<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GameBoy 模拟器 · 网页版</title>
<style>
:root{
  --bg0:#070510; --bg1:#0d0a1f; --panel:#131028; --panel2:#1a1533;
  --line:#2b1f4d; --line2:#4a2f7a;
  --green:#9bce4e; --green-dim:#4a7a2a; --mint:#c0e880;
  --amber:#ffb020; --cyan:#00f0ff; --red:#ff3d81;
  --text:#e8e4f8; --text-dim:#9d92c4; --text-faint:#655a8f;
  --font-mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1000px 600px at 24% -6%, rgba(84,44,178,.32) 0%, transparent 62%), radial-gradient(900px 520px at 88% 8%, rgba(255,46,166,.13) 0%, transparent 58%),
    linear-gradient(160deg,var(--bg1),var(--bg0) 70%);
  color:var(--text); font-family:var(--font-mono);
  display:flex; flex-direction:column; overflow:auto;
}
header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:10px 18px;
  background:linear-gradient(90deg,rgba(0,240,255,.5),rgba(178,107,255,.35) 45%,rgba(255,46,166,.5)) bottom/100% 1px no-repeat rgba(13,10,31,.8);
}
.logo{display:flex;align-items:center;gap:10px}
.logo .chip{
  width:30px;height:30px;border:2px solid var(--cyan);border-radius:6px;
  position:relative;box-shadow:0 0 14px rgba(0,240,255,.4);
}
.logo .chip::before{content:"";position:absolute;inset:6px;border:1px solid rgba(178,107,255,.6);border-radius:2px}
.logo .chip::after{content:"";position:absolute;inset:11px;background:#ff2ea6;border-radius:1px;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.logo h1{font-size:16px;letter-spacing:2px;color:var(--text);text-shadow:0 0 14px rgba(0,240,255,.45)}
.logo small{display:block;font-size:10px;color:var(--text-dim);letter-spacing:1px;font-weight:normal}
.stats{display:flex;gap:10px;margin-left:auto;align-items:center}
.stat{border:1px solid var(--line);background:rgba(13,10,31,.85);border-radius:8px;padding:4px 12px;text-align:center;min-width:70px}
.stat .k{font-size:9px;color:var(--text-faint);letter-spacing:1px}
.stat .v{font-size:16px;font-weight:bold;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.4)}
main{
  flex:1 1 auto;display:grid;gap:14px;padding:16px;
  grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;
  grid-template-areas:"crt crt" "dpad touchpad" "toolbar toolbar";
  align-items:center;justify-items:center;
}
.crt{grid-area:crt}
.dpad{grid-area:dpad}
.touchpad{grid-area:touchpad}
.toolbar{grid-area:toolbar}
.crt{
  position:relative;border:2px solid rgba(0,240,255,.35);border-radius:12px;overflow:hidden;
  background:#0f380f;
  box-shadow:0 0 0 6px rgba(13,10,31,.9),0 0 26px rgba(0,240,255,.18),0 0 64px rgba(178,107,255,.16),0 20px 60px rgba(0,0,0,.75);
}
#screen{display:block;width:100%;height:auto;image-rendering:pixelated;background:#9bbc0f}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:#0f380fee;z-index:5;cursor:pointer;text-align:center;padding:24px;
}
.overlay h2{font-size:clamp(22px,5vw,36px);color:var(--green);letter-spacing:4px;text-shadow:0 0 20px #9bce4eaa}
.overlay p{font-size:14px;color:var(--text-dim);line-height:2}
.overlay .press{font-size:16px;color:var(--amber);letter-spacing:2px;animation:blink 1.4s infinite}
.overlay input[type=file]{display:none} .overlay::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(5,28,8,.18) 0 1px,transparent 1px 4px)}
.filebtn{
  padding:12px 32px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;
  border:2px solid var(--green);border-radius:10px;background:#1a3a1a;color:var(--green);
  transition:all .2s;
}
.filebtn:hover{background:#2a5a2a;box-shadow:0 0 20px #9bce4e44}
.exitbtn{
  padding:6px 14px;font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;
  border:2px solid var(--red);border-radius:8px;background:rgba(42,16,38,.75);color:var(--red);
  transition:all .2s;margin-left:6px;white-space:nowrap;
}
.exitbtn:hover{background:#541d3c;box-shadow:0 0 16px rgba(255,61,129,.4)}
.hidden{display:none!important}
.touchpad{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tbtn{
  width:56px;height:56px;font-family:inherit;font-size:20px;border-radius:50%;
  color:var(--cyan);background:rgba(19,16,40,.85);border:2px solid var(--line2);cursor:pointer;
  user-select:none;backdrop-filter:blur(4px);touch-action:none;
}
.tbtn:active{background:rgba(64,26,74,.9);color:#fff;border-color:#ff2ea6}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.dpad button{width:44px;height:44px;font-size:16px;color:var(--cyan);background:rgba(19,16,40,.85);border:2px solid var(--line2);border-radius:8px;cursor:pointer;user-select:none;touch-action:none}
.dpad .up{grid-column:2;grid-row:1} .dpad .down{grid-column:2;grid-row:3}
.dpad .left{grid-column:1;grid-row:2} .dpad .right{grid-column:3;grid-row:2}
.dpad .center{grid-column:2;grid-row:2;background:rgba(10,8,24,.9);border-color:var(--line)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;width:100%;max-width:640px;padding:0 4px;flex:0 0 auto}
.toolbtn{
  padding:8px 14px;font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;
  color:var(--cyan);background:rgba(19,16,40,.85);border:2px solid var(--line2);border-radius:8px;
  user-select:none;touch-action:none;white-space:nowrap;
}
.toolbtn:hover{background:rgba(35,24,66,.9);color:#fff}
.toolbtn:active{background:rgba(64,26,74,.9);color:#fff}
.toolbtn.on{background:rgba(64,26,74,.9);color:#fff;border-color:#ff2ea6}
#volSlider{width:90px;accent-color:var(--cyan);cursor:pointer}
.pauseoverlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#00000088;z-index:4;font-size:20px;color:var(--amber);letter-spacing:3px;pointer-events:none;
}
footer{flex:0 0 auto;padding:8px 18px;border-top:1px solid transparent;font-size:10px;color:var(--text-faint);text-align:center;background:linear-gradient(90deg,transparent,rgba(178,107,255,.4),transparent) top/100% 1px no-repeat}
@media (max-width:600px){
  .crt{max-width:95vw}
  .logo h1{font-size:13px}
  .stat{min-width:56px;padding:3px 8px}
  .stat .v{font-size:14px}
}
@media (max-width:380px){
  .dpad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px}
  .dpad button{width:38px;height:38px;font-size:14px}
  .tbtn{width:48px;height:48px;font-size:18px}
}
/* ===== 横屏（手机横过来）：真掌机三栏布局，一屏放下不滚动 ===== */
@media (orientation:landscape) and (max-height:600px){
  html,body{height:100%}
  body{overflow:hidden}
  header{display:none}          /* 横屏全屏时省掉顶部，把空间全让给掌机 */
  main{
    height:100vh;height:100dvh;  /* 填满视口，绝不超出一屏 */
    grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"dpad crt touchpad" "dpad toolbar touchpad";
    gap:8px;padding:6px;
  }
  .crt{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  #screen{width:auto;height:auto;max-width:100%;max-height:100%}  /* 宽高都受约束，保持 160:144 比例 */
  /* 触屏键放大：方向键 44→58、AB 56→68，符合拇指按压力学 */
  .dpad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:5px}
  .dpad button{width:58px;height:58px;font-size:20px}
  .tbtn{width:68px;height:68px;font-size:24px}
  .toolbar{max-width:none;justify-content:center} .toolbtn{padding:5px 9px;font-size:11px} #volSlider{width:70px}
  footer{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="chip"></div>
    <h1>GameBoy 模拟器<small>自己写的 CPU + PPU · 网页版</small></h1>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">状态</div><div class="v" id="statusV">待机</div></div>
    <div class="stat"><div class="k">帧率</div><div class="v" id="fpsV">0</div></div>
  </div>
  <button class="exitbtn hidden" id="btnExit">⏻ 退出</button>
</header>

<main>
  <div class="crt" id="crt">
    <canvas id="screen" width="640" height="576"></canvas>
    <div class="overlay" id="overlay">
      <h2>GameBoy 模拟器</h2>
      <p>自己写的 CPU（全指令集 + 中断 + 定时器）<br>自己写的 PPU（扫描线渲染 + VBlank）<br>Blargg 考卷 75/75 全绿</p>
      <p style="color:var(--cyan);font-size:12px">内置 5 款开源游戏 · 或加载你自己的 .gb ROM</p>
      <button class="filebtn" data-game="adjustris">▶ 玩 Adjustris（俄罗斯方块类）</button>
      <button class="filebtn" data-game="2048">▶ 玩 2048</button>
      <button class="filebtn" data-game="minesweep">▶ 玩扫雷</button>
      <button class="filebtn" data-game="tobu">▶ 玩 Tobu Tobu Girl</button>
      <button class="filebtn" data-game="gigant_golf">▶ 玩 Gigant Golf</button>
      <button class="filebtn" id="btnLoad" style="border-color:var(--line2);color:var(--text-dim);font-size:13px">📁 加载 ROM</button>
      <input type="file" id="fileInput" accept=".gb,.gbc">
      <p class="press">方向键移动 · X=A · Z=B · Enter=Start · P 暂停 · F 快进</p>
    </div>
    <div class="pauseoverlay hidden" id="pauseoverlay">⏸ 已暂停 · 按 P 继续</div>
  </div>
  <div class="dpad" id="dpad">
    <button class="up" data-key="up">▲</button>
    <button class="down" data-key="down">▼</button>
    <button class="left" data-key="left">◀</button>
    <button class="right" data-key="right">▶</button>
    <button class="center"></button>
  </div>
  <div class="touchpad" id="touchpad">
    <button class="tbtn" data-key="a">A</button>
    <button class="tbtn" data-key="b">B</button>
    <button class="tbtn" data-key="start">S</button>
  </div>
  <div class="toolbar" id="toolbar">
    <button class="toolbtn" id="btnPause">⏸ 暂停</button>
    <button class="toolbtn" id="btnFF">⏩ 快进</button>
    <button class="toolbtn" id="btnPalette">🎨 滤镜</button>
    <button class="toolbtn" id="btnMute">🔊 有声</button>
    <input type="range" id="volSlider" min="0" max="100" value="100" title="音量">
    <button class="toolbtn" id="btnFull">⛶ 全屏</button>
  </div>
</main>

<footer>
  <span>纯手写模拟器 · 无第三方模拟库 · 键盘/触屏双支持</span>
</footer>

<script>
"use strict";
/* ================= 网页外壳（wasm 内核） ================= */
// 内核（CPU/PPU/APU/总线/MBC/SRAM）已编译进 gb_emu.wasm（Rust 版，和桌面共一份）。
// 这里只保留：canvas 渲染、Web Audio 播放、键盘/触屏、localStorage 存档、三款游戏切换。
const cvs=document.getElementById("screen"), ctx=cvs.getContext("2d");
const SCALE=4, W=160*SCALE, H=144*SCALE;
// 4 套配色（经典绿 / 复古黄绿 / 黑白 / 蓝背光），存的是 4 档色号对应的 RGB
const PALETTES=[
  [0xE0F8D0,0x88C070,0x346856,0x081820],  // 经典绿
  [0x9BBC0F,0x8BAC0F,0x306230,0x0F380F],  // 复古黄绿
  [0xFFFFFF,0xAAAAAA,0x555555,0x000000],  // 黑白
  [0xE0F8F0,0x88C0D0,0x346878,0x081820],  // 蓝背光
];
let curPalette=0;
function palette(){ return PALETTES[curPalette]; }
const imgData=ctx.createImageData(W,H);

let wasm=null, mem=null, gb=null;
// 显式状态机：'menu' = 菜单态（overlay 显示，可点游戏）；'playing' = 运行态。
// 所有东西（循环/按键/音频/存档）都听 gameState 指挥，不再靠零散的布尔值。
let gameState="menu";
// 当前按键状态（0=按下）。位序和 Rust joypad 一致：dir bit0-3=右左上下，btn bit0-3=A B Select Start
let curDir=0x0F, curBtn=0x0F;
let sramKey=null, saveTimer=null;
let audioCtx=null, audioBuf=null, audioPos=0, gainNode=null;
let paused=false, turbo=false, muted=false, volume=1.0;
let lastT=0, fpsN=0, fpsAcc=0;

const $=id=>document.getElementById(id);
function hexToRgb(h){ return [(h>>16)&255,(h>>8)&255,h&255]; }

// wasm 启动即加载（fetch 流式编译，正规 wasm 用法）
const wasmReady = (async()=>{
  const res=await fetch('gb_emu.wasm');
  const bytes=await res.arrayBuffer();
  const {instance}=await WebAssembly.instantiate(bytes,{});
  wasm=instance.exports;
  mem=wasm.memory;
})();

// 渲染：读 wasm 的 framebuffer（每字节色号 0~3，行优先 160×144）
function render(){
  const ptr=wasm.gb_screen_ptr(gb);
  const fb=new Uint8Array(mem.buffer, ptr, 160*144);
  const pal=palette();
  for(let y=0;y<144;y++)for(let x=0;x<160;x++){
    const c=hexToRgb(pal[fb[y*160+x]]);
    for(let sy=0;sy<SCALE;sy++)for(let sx=0;sx<SCALE;sx++){
      const idx=((y*SCALE+sy)*W+x*SCALE+sx)*4;
      imgData.data[idx]=c[0]; imgData.data[idx+1]=c[1]; imgData.data[idx+2]=c[2]; imgData.data[idx+3]=255;
    }
  }
  ctx.putImageData(imgData,0,0);
}

// 音频：把 wasm 累计的样本（i16）搬进 1 秒环形缓冲，Web Audio 循环播放
function pushAudio(){
  const n=wasm.gb_audio_len(gb);
  if(n===0) return;
  const p=wasm.gb_audio_ptr(gb);
  const samples=new Int16Array(mem.buffer, p, n);
  for(let i=0;i<n;i++){
    audioBuf[audioPos]=samples[i]/32768;
    audioPos=(audioPos+1)%audioBuf.length;
  }
  wasm.gb_audio_clear(gb);
}
function initAudio(){
  if(audioCtx) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=ctx.createBuffer(1,44100,44100);   // 1 秒环形缓冲
  audioBuf=buf.getChannelData(0); audioPos=0;
  const src=ctx.createBufferSource();
  src.buffer=buf; src.loop=true;
  gainNode=ctx.createGain();                   // 音量控制节点
  gainNode.gain.value=volume;
  src.connect(gainNode); gainNode.connect(ctx.destination);
  src.start();
  audioCtx=ctx;
  if(ctx.state==="suspended") ctx.resume();
}

// 主循环：每帧跑一次 gb_run_frame（快进时连跑 3 帧），同步按键、渲染、喂音频
function loop(t){
  if(gameState!=="playing") return;
  const dt=t-lastT; lastT=t;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>500){ $("fpsV").textContent=Math.round(1000/(fpsAcc/fpsN)); fpsAcc=0; fpsN=0; }
  wasm.gb_set_keys(gb, curDir, curBtn);
  if(wasm.gb_tick_rtc) wasm.gb_tick_rtc(gb, BigInt(Math.floor(Date.now()/1000)));   // MBC3 RTC：每帧灌墙钟秒数
  if(paused){ render(); requestAnimationFrame(loop); return; }   // 暂停：不推进内核，只保持画面
  const frames=turbo?3:1;
  for(let i=0;i<frames;i++) wasm.gb_run_frame(gb);
  render();
  pushAudio();
  requestAnimationFrame(loop);
}

// 从 ROM 头 0x134~0x143 取游戏标题，做存档键（同款游戏读回同一份存档）
function romTitle(rom){
  let s="";
  for(let i=0x134;i<0x144;i++){ const c=rom[i]||0; if(c===0)break; s+=String.fromCharCode(c); }
  return s.replace(/[^A-Za-z0-9]/g,"").toLowerCase();
}

// 存档：SRAM → localStorage
function saveSram(){
  const len=wasm.gb_sram_len(gb);
  if(len===0) return;
  const p=wasm.gb_sram_ptr(gb);
  const arr=Array.from(new Uint8Array(mem.buffer, p, len));
  try{ localStorage.setItem(sramKey, arr.join(",")); }catch(e){}
}
function loadSram(){
  const len=wasm.gb_sram_len(gb);
  if(len===0) return;
  try{
    const saved=localStorage.getItem(sramKey);
    if(saved){
      const arr=saved.split(",").map(Number);
      if(arr.length===len){
        const tmp=wasm.gb_alloc(len);
        new Uint8Array(mem.buffer, tmp, len).set(arr);
        wasm.gb_sram_load(gb, tmp, len);
        wasm.gb_free_alloc(tmp, len);
      }
    }
  }catch(e){}
}

// 开始游戏：建实例 → 装 ROM → 回读存档 → 启动
function startGame(rom){
  if(gb) wasm.gb_free(gb);
  gb=wasm.gb_new();
  const rp=wasm.gb_alloc(rom.length);
  new Uint8Array(mem.buffer, rp, rom.length).set(rom);
  wasm.gb_load(gb, rp, rom.length);
  wasm.gb_free_alloc(rp, rom.length);

  curDir=0x0F; curBtn=0x0F;
  sramKey="gbem-sram-"+romTitle(rom);
  loadSram();
  if(saveTimer) clearInterval(saveTimer);
  if(wasm.gb_sram_len(gb)>0) saveTimer=setInterval(saveSram, 2000);

  gameState="playing";
  $("statusV").textContent="运行中";
  $("overlay").classList.add("hidden");
  $("btnExit").classList.remove("hidden");
  lastT=performance.now();
  initAudio();
  requestAnimationFrame(loop);
}

// 退出：强制存一次档 → 停循环 → 释放实例 → 回菜单态
function exitGame(){
  if(gameState!=="playing") return;
  saveSram();                       // 决策②：退出瞬间强制收尾存档，不赌 2 秒定时器
  if(saveTimer){ clearInterval(saveTimer); saveTimer=null; }
  gameState="menu";
  if(gb){ wasm.gb_free(gb); gb=null; }   // 决策①：直接释放，退出=彻底结束一局
  curDir=0x0F; curBtn=0x0F;
  paused=false; turbo=false;             // 重置体验开关，免得带进下一局
  $("pauseoverlay").classList.add("hidden");
  $("btnPause").classList.remove("on"); $("btnPause").textContent="⏸ 暂停";
  $("btnFF").classList.remove("on");
  $("statusV").textContent="待机";
  $("overlay").classList.remove("hidden");
  $("btnExit").classList.add("hidden");
}

// 暂停 / 快进 / 滤镜 / 音量 四个体验开关
function togglePause(){
  paused=!paused;
  $("pauseoverlay").classList.toggle("hidden",!paused);
  $("btnPause").classList.toggle("on",paused);
  $("btnPause").textContent=paused?"▶ 继续":"⏸ 暂停";
}
function toggleTurbo(){
  turbo=!turbo;
  $("btnFF").classList.toggle("on",turbo);
}
function cyclePalette(){
  curPalette=(curPalette+1)%PALETTES.length;
  const names=["经典绿","复古黄绿","黑白","蓝背光"];
  $("btnPalette").textContent="🎨 "+names[curPalette];
  render();
}
function setVolume(v){
  volume=v;
  if(gainNode) gainNode.gain.value=v;
  muted=false;
  $("btnMute").textContent="🔊 有声";
  $("volSlider").value=Math.round(v*100);
}
function toggleMute(){
  muted=!muted;
  if(gainNode) gainNode.gain.value=muted?0:volume;
  $("btnMute").textContent=muted?"🔇 静音":"🔊 有声";
}
// 全屏：进入全屏 + 尝试锁横屏（Android Chrome 有效，iOS 无效但不会报错）
async function toggleFullscreen(){
  if(!document.fullscreenElement){
    try{
      await document.documentElement.requestFullscreen();
      if(screen.orientation && screen.orientation.lock){
        try{ await screen.orientation.lock("landscape"); }catch(e){}
      }
    }catch(e){}
  }else{
    document.exitFullscreen();
  }
}

$("btnLoad").addEventListener("click",()=>$("fileInput").click());
$("btnExit").addEventListener("click",exitGame);
$("btnPause").addEventListener("click",togglePause);
$("btnFF").addEventListener("click",toggleTurbo);
$("btnPalette").addEventListener("click",cyclePalette);
$("btnMute").addEventListener("click",toggleMute);
$("btnFull").addEventListener("click",toggleFullscreen);
$("volSlider").addEventListener("input",e=>setVolume(e.target.value/100));
$("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ await wasmReady; startGame(new Uint8Array(r.result)); };
  r.readAsArrayBuffer(f);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ exitGame(); return; }
  if(gameState!=="playing") return;
  if(e.key==="p"||e.key==="P"){ togglePause(); return; }
  if(e.key==="f"||e.key==="F"){ toggleTurbo(); return; }
  const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];
  if(!k) return;
  e.preventDefault();
  pressKey(k);
});
document.addEventListener("keyup",e=>{
  if(gameState!=="playing") return;
  const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];
  if(!k) return;
  releaseKey(k);
});

function b64toRom(b64){const bin=atob(b64);const rom=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)rom[i]=bin.charCodeAt(i);return rom;}

for(const btn of document.querySelectorAll("[data-game]")){btn.addEventListener("click",async()=>{await wasmReady;startGame(b64toRom(ROMS_B64[btn.dataset.game]))});}
const keyMap={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",x:"a",z:"b",Enter:"start"," ":"start",Shift:"select"};
function pressKey(k){
  if(k==="up") curDir&=~0x04;
  else if(k==="down") curDir&=~0x08;
  else if(k==="left") curDir&=~0x02;
  else if(k==="right") curDir&=~0x01;
  else if(k==="a") curBtn&=~0x01;
  else if(k==="b") curBtn&=~0x02;
  else if(k==="select") curBtn&=~0x04;
  else if(k==="start") curBtn&=~0x08;
}
function releaseKey(k){
  if(k==="up") curDir|=0x04;
  else if(k==="down") curDir|=0x08;
  else if(k==="left") curDir|=0x02;
  else if(k==="right") curDir|=0x01;
  else if(k==="a") curBtn|=0x01;
  else if(k==="b") curBtn|=0x02;
  else if(k==="select") curBtn|=0x04;
  else if(k==="start") curBtn|=0x08;
}

/* 触屏 */
for(const btn of document.querySelectorAll("[data-key]")){
  const k=btn.dataset.key;
  const on=e=>{ e.preventDefault(); if(gameState!=="playing")return; pressKey(k); };
  const off=e=>{ e.preventDefault(); if(gameState!=="playing")return; releaseKey(k); };
  btn.addEventListener("pointerdown",on);
  btn.addEventListener("pointerup",off);
  btn.addEventListener("pointerleave",off);
  btn.addEventListener("pointercancel",off);
}
