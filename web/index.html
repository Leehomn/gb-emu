<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GameBoy 模拟器 · 网页版</title>
<style>
:root{
  --bg0:#0a0f0a; --bg1:#0f1a0f; --panel:#162416; --panel2:#1c2e1c;
  --line:#2a4a2a; --line2:#3a6a3a;
  --green:#9bce4e; --green-dim:#4a7a2a; --mint:#c0e880;
  --amber:#ffb020; --cyan:#3ee6ff; --red:#ff4d5e;
  --text:#e0f0d0; --text-dim:#8aaa70; --text-faint:#4a6a3a;
  --font-mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1000px 600px at 30% 0%, #1a3a1a 0%, transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg0) 70%);
  color:var(--text); font-family:var(--font-mono);
  display:flex; flex-direction:column; overflow:auto;
}
header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:10px 18px; border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,#16241688,#1c2e1c44);
}
.logo{display:flex;align-items:center;gap:10px}
.logo .chip{
  width:30px;height:30px;border:2px solid var(--green);border-radius:6px;
  position:relative;box-shadow:0 0 12px #9bce4e55;
}
.logo .chip::before{content:"";position:absolute;inset:6px;border:1px solid var(--green-dim);border-radius:2px}
.logo .chip::after{content:"";position:absolute;inset:11px;background:var(--green);border-radius:1px;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.logo h1{font-size:16px;letter-spacing:2px;color:var(--green);text-shadow:0 0 14px #9bce4e66}
.logo small{display:block;font-size:10px;color:var(--text-dim);letter-spacing:1px;font-weight:normal}
.stats{display:flex;gap:10px;margin-left:auto;align-items:center}
.stat{border:1px solid var(--line);background:#0f1f0fcc;border-radius:8px;padding:4px 12px;text-align:center;min-width:70px}
.stat .k{font-size:9px;color:var(--text-faint);letter-spacing:1px}
.stat .v{font-size:16px;font-weight:bold;color:var(--mint)}
main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.crt{
  position:relative;border:2px solid var(--line2);border-radius:12px;overflow:hidden;
  background:#0f380f;
  box-shadow:0 0 0 6px #0f1f0f,0 0 50px #9bce4e22,0 20px 60px #00000088;
}
#screen{display:block;width:100%;height:auto;image-rendering:pixelated;background:#9bbc0f}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:#0f380fee;z-index:5;cursor:pointer;text-align:center;padding:24px;
}
.overlay h2{font-size:clamp(22px,5vw,36px);color:var(--green);letter-spacing:4px;text-shadow:0 0 20px #9bce4eaa}
.overlay p{font-size:14px;color:var(--text-dim);line-height:2}
.overlay .press{font-size:16px;color:var(--amber);letter-spacing:2px;animation:blink 1.4s infinite}
.overlay input[type=file]{display:none}
.filebtn{
  padding:12px 32px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;
  border:2px solid var(--green);border-radius:10px;background:#1a3a1a;color:var(--green);
  transition:all .2s;
}
.filebtn:hover{background:#2a5a2a;box-shadow:0 0 20px #9bce4e44}
.hidden{display:none!important}
.controls{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;max-width:640px;padding:0 4px;flex:0 0 auto;
}
.touchpad{display:flex;gap:8px;align-items:center}
.tbtn{
  width:56px;height:56px;font-family:inherit;font-size:20px;border-radius:50%;
  color:var(--green);background:#1a3a1acc;border:2px solid var(--line2);cursor:pointer;
  user-select:none;backdrop-filter:blur(4px);touch-action:none;
}
.tbtn:active{background:#2a5a2a;color:#fff}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.dpad button{width:44px;height:44px;font-size:16px;color:var(--green);background:#1a3a1acc;border:2px solid var(--line2);border-radius:8px;cursor:pointer;user-select:none;touch-action:none}
.dpad .up{grid-column:2;grid-row:1} .dpad .down{grid-column:2;grid-row:3}
.dpad .left{grid-column:1;grid-row:2} .dpad .right{grid-column:3;grid-row:2}
.dpad .center{grid-column:2;grid-row:2;background:#0f1f0f;border-color:var(--line)}
footer{flex:0 0 auto;padding:8px 18px;border-top:1px solid var(--line);font-size:10px;color:var(--text-faint);text-align:center}
@media (max-width:600px){
  .crt{max-width:95vw}
  .logo h1{font-size:13px}
  .stat{min-width:56px;padding:3px 8px}
  .stat .v{font-size:14px}
}
@media (max-width:380px){
  .controls{flex-wrap:wrap;justify-content:center;gap:6px}
  .dpad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px}
  .dpad button{width:38px;height:38px;font-size:14px}
  .tbtn{width:48px;height:48px;font-size:18px}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="chip"></div>
    <h1>GameBoy 模拟器<small>自己写的 CPU + PPU · 网页版</small></h1>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">状态</div><div class="v" id="statusV">待机</div></div>
    <div class="stat"><div class="k">帧率</div><div class="v" id="fpsV">0</div></div>
  </div>
</header>

<main>
  <div class="crt" id="crt">
    <canvas id="screen" width="640" height="576"></canvas>
    <div class="overlay" id="overlay">
      <h2>GameBoy 模拟器</h2>
      <p>自己写的 CPU（全指令集 + 中断 + 定时器）<br>自己写的 PPU（扫描线渲染 + VBlank）<br>Blargg 考卷 75/75 全绿</p>
      <p style="color:var(--cyan);font-size:12px">内置 2 款开源游戏 · 或加载你自己的 .gb ROM</p>
      <button class="filebtn" data-game="2048">▶ 玩 2048</button>
      <button class="filebtn" data-game="minesweep">▶ 玩扫雷</button>
      <button class="filebtn" id="btnLoad" style="border-color:var(--line2);color:var(--text-dim);font-size:13px">📁 加载 ROM</button>
      <input type="file" id="fileInput" accept=".gb,.gbc">
      <p class="press">点击开始后，方向键移动 · X=A · Z=B · Enter=Start</p>
    </div>
  </div>
  <div class="controls" id="controls">
    <div class="dpad" id="dpad">
      <button class="up" data-key="up">▲</button>
      <button class="down" data-key="down">▼</button>
      <button class="left" data-key="left">◀</button>
      <button class="right" data-key="right">▶</button>
      <button class="center"></button>
    </div>
    <div class="touchpad" id="touchpad">
      <button class="tbtn" data-key="a">A</button>
      <button class="tbtn" data-key="b">B</button>
      <button class="tbtn" data-key="start">S</button>
    </div>
  </div>
</main>

<footer>
  <span>纯手写模拟器 · 无第三方模拟库 · 键盘/触屏双支持</span>
</footer>

<script>
"use strict";
/* ================= GameBoy CPU（从 Rust 版逐行移植） ================= */
const FLAG_Z=0x80, FLAG_N=0x40, FLAG_H=0x20, FLAG_C=0x10;

class Registers {
  constructor(){ this.reset(); }
  reset(){ this.a=0x01; this.f=0xB0; this.b=0x00; this.c=0x13; this.d=0x00; this.e=0xD8; this.h=0x01; this.l=0x4D; }
  bc(){ return (this.b<<8)|this.c; }
  de(){ return (this.d<<8)|this.e; }
  hl(){ return (this.h<<8)|this.l; }
  af(){ return (this.a<<8)|this.f; }
  set_bc(v){ this.b=(v>>8)&0xFF; this.c=v&0xFF; }
  set_de(v){ this.d=(v>>8)&0xFF; this.e=v&0xFF; }
  set_hl(v){ this.h=(v>>8)&0xFF; this.l=v&0xFF; }
  set_af(v){ this.a=(v>>8)&0xFF; this.f=v&0xF0; }
  flag(m){ return (this.f&m)!==0; }
  set_flag(m,on){ if(on)this.f|=m; else this.f&=~m; }
  get(i){ switch(i){case 0:return this.b;case 1:return this.c;case 2:return this.d;case 3:return this.e;case 4:return this.h;case 5:return this.l;case 7:return this.a;} }
  set(i,v){ switch(i){case 0:this.b=v;break;case 1:this.c=v;break;case 2:this.d=v;break;case 3:this.e=v;break;case 4:this.h=v;break;case 5:this.l=v;break;case 7:this.a=v;break;} }
}

class Bus {
  constructor(){ this.mem=new Uint8Array(0x10000); this.reset(); }
  reset(){
    this.mem.fill(0);
    this.cart=new Uint8Array(0);   // 完整卡带 ROM（含 MBC 换页的全部 bank）
    this.ram=new Uint8Array(0);    // SRAM 存档
    this.mbc_type=0; this.ramg=false; this.bank1=1; this.bank2=0; this.mode=false; this.multicart=false;
    this.div_acc=0; this.tac=0; this.tima_acc=0;
    this.joypad_dir=0x0F; this.joypad_btn=0x0F;
  }
  // 卡带头 0x149 字节 → SRAM 大小
  ram_size_for(rom){ const t=rom.length>0x149?rom[0x149]:0; return t===1?2048:t===2?8192:t===3?32768:t===4?131072:t===5?65536:0; }
  // 8Mbit MBC1 multicart：4 个 0x40000 页里 ≥3 页在 0x0104 有相同的任天堂 logo
  is_multicart(cart){
    if(cart.length!==0x100000) return false;
    let count=0;
    for(let p=0;p<4;p++){ let same=true; for(let i=0;i<0x30;i++){ if(cart[0x104+i]!==cart[p*0x40000+0x104+i]){same=false;break;} } if(same)count++; }
    return count>=3;
  }
  loadRom(rom){
    this.cart=rom.slice();
    this.mbc_type=rom.length>0x147?rom[0x147]:0;
    this.ram=new Uint8Array(this.ram_size_for(rom));
    this.ramg=false; this.bank1=1; this.bank2=0; this.mode=false;
    this.multicart=this.is_multicart(this.cart);
  }
  // MBC1 换页核心：算「低 bank」「高 bank」两个窗口各落在 ROM 的哪个偏移
  rom_offsets(){
    const upper_bits=this.multicart?(this.bank2<<4):(this.bank2<<5);
    const lower_bits=this.multicart?(this.bank1&0x0F):this.bank1;
    const lower_bank=this.mode?upper_bits:0;
    const upper_bank=upper_bits|lower_bits;
    return [0x4000*lower_bank, 0x4000*upper_bank];
  }
  read_rom(addr){
    if(this.cart.length===0) return 0xFF;
    const offs=this.rom_offsets();
    const base=addr<0x4000?offs[0]:offs[1];
    const off=(base|(addr&0x3FFF))&(this.cart.length-1);
    return this.cart[off];
  }
  ram_addr(addr){
    const off=this.mode?this.bank2*0x2000:0;
    return (off|(addr&0x1FFF))&(this.ram.length-1);
  }
  read_ram(addr){
    if(this.ram.length===0||!this.ramg) return 0xFF;   // 没开锁读到的就是垃圾
    return this.ram[this.ram_addr(addr)];
  }
  write_ram(addr,val){ if(this.ram.length>0&&this.ramg) this.ram[this.ram_addr(addr)]=val; }
  read(addr){
    if(addr>=0x0000&&addr<0x8000) return this.read_rom(addr);
    if(addr>=0xA000&&addr<0xC000) return this.read_ram(addr);
    if(addr===0xFF00){
      const sel=this.mem[0xFF00];
      let result=0x0F;
      if((sel&0x20)===0) result&=this.joypad_btn;   // bit5=0 → 读功能键组(A/B/Select/Start)
      if((sel&0x10)===0) result&=this.joypad_dir;   // bit4=0 → 读方向键组(上下左右)
      return (sel&0x30)|result|0xC0;
    }
    return this.mem[addr];
  }
  write(addr,val){
    // 卡带区写入 = MBC 命令（不是真往 ROM 写，是给换页芯片下指令）
    const is_mbc1=(this.mbc_type===1||this.mbc_type===2||this.mbc_type===3);
    if(addr>=0x0000&&addr<0x2000){ if(is_mbc1) this.ramg=(val&0x0F)===0x0A; return; }   // RAM 使能：低4位=0xA 开锁
    if(addr>=0x2000&&addr<0x4000){ if(is_mbc1){ this.bank1=val&0x1F; if(this.bank1===0)this.bank1=1; } return; }  // 低5位 bank，0 强制 1
    if(addr>=0x4000&&addr<0x6000){ if(is_mbc1) this.bank2=val&0x03; return; }           // 高2位 bank
    if(addr>=0x6000&&addr<0x8000){ if(is_mbc1) this.mode=(val&1)!==0; return; }         // 模式位
    if(addr>=0xA000&&addr<0xC000){ this.write_ram(addr,val); return; }                  // SRAM 写（要开锁）
    switch(addr){
      case 0xFF04: this.mem[0xFF04]=0; this.div_acc=0; return;
      case 0xFF07: this.tac=val&7; this.mem[0xFF07]=val; return;
      case 0xFF0F: this.mem[0xFF0F]=val&0x1F; return;
      case 0xFF44: return;    // LY 只读
      case 0xFF41: this.mem[0xFF41]=(this.mem[0xFF41]&0x07)|(val&0xF8); return;  // STAT：bit0-2只读，游戏只能写bit3-6使能位
      case 0xFF46:{           // DMA：把 XX00~XX9F 搬到 OAM 0xFE00
        const src=(val&0xFF)<<8;
        for(let i=0;i<0xA0;i++) this.mem[0xFE00+i]=this.read(src+i);   // 走 read() 让 ROM 区正确取到卡带
        return;
      }
      default: this.mem[addr]=val;
    }
  }
  read16(addr){ return this.read(addr)|(this.read((addr+1)&0xFFFF)<<8); }
  write16(addr,val){ this.write(addr,val&0xFF); this.write((addr+1)&0xFFFF,(val>>8)&0xFF); }
  tick(t){
    this.div_acc+=t;
    while(this.div_acc>=256){ this.div_acc-=256; this.mem[0xFF04]=(this.mem[0xFF04]+1)&0xFF; }
    if(this.tac&4){
      const period=[1024,16,64,256][this.tac&3];
      this.tima_acc+=t;
      while(this.tima_acc>=period){
        this.tima_acc-=period;
        const v=(this.mem[0xFF05]+1)&0xFF;
        if(v===0){ this.mem[0xFF05]=this.mem[0xFF06]; this.mem[0xFF0F]|=0x04; }  // 溢出→回装TMA+请求定时器中断
        else { this.mem[0xFF05]=v; }
      }
    }
  }
}

class Ppu {
  constructor(){ this.framebuffer=new Uint8Array(160*144); this.line_cycles=0; this.ly=0; this.windowLine=0; }
  tick(t,bus){
    this.line_cycles+=t;
    if(this.line_cycles>=456){
      this.line_cycles-=456;
      this.ly++;
      if(this.ly===144) bus.mem[0xFF0F]|=0x01;
      else if(this.ly>153){ this.ly=0; this.windowLine=0; }
      bus.mem[0xFF44]=this.ly;
      if(this.ly<144){ this.renderLine(bus); this.renderSprites(bus); }
    }
    this.updateStat(bus);
  }
  updateStat(bus){
    const lyc=bus.mem[0xFF45];
    let mode;
    if(this.ly>=144) mode=1;                  // VBlank
    else if(this.line_cycles<80) mode=2;      // OAM 扫描
    else if(this.line_cycles<252) mode=3;     // 数据传送
    else mode=0;                              // HBlank
    const stat=bus.mem[0xFF41];
    let ns=(stat&0xF8)|mode;
    if(lyc===this.ly) ns|=0x04; else ns&=0xFB;
    bus.mem[0xFF41]=ns;
    const lycLine=(lyc===this.ly && (stat&0x40)!==0);
    const modeLine=(mode===0 && (stat&0x08)!==0)||(mode===1 && (stat&0x10)!==0)||(mode===2 && (stat&0x20)!==0);
    if(lycLine||modeLine) bus.mem[0xFF0F]|=0x02;   // 电平触发：拉高
    else bus.mem[0xFF0F]&=0xFD;                    // 拉低
  }
  renderLine(bus){
    const lcdc=bus.mem[0xFF40];
    if((lcdc&0x80)===0){ this.framebuffer.fill(0,this.ly*160,(this.ly+1)*160); return; }
    const y=this.ly;
    const scy=bus.mem[0xFF42], scx=bus.mem[0xFF43];
    const mapBase=(lcdc&0x08)?0x9C00:0x9800;
    const signed=(lcdc&0x10)===0;
    const bgp=bus.mem[0xFF47];
    // 窗口层是否在本行生效：开关开 + 窗口顶边 WY <= 当前行
    const winEnabled=((lcdc&0x20)!==0) && (bus.mem[0xFF4A]<=y);
    const wx=bus.mem[0xFF4B];
    const winMapBase=(lcdc&0x40)?0x9C00:0x9800;
    for(let x=0;x<160;x++){
      // 判断这一列属于窗口层还是背景层（WX 存的是真实左边沿+7）
      let tmBase, tileY, offX;
      if(winEnabled && x+7>=wx){ tmBase=winMapBase; tileY=this.windowLine; offX=x+7-wx; }
      else { tmBase=mapBase; tileY=(y+scy)&255; offX=(x+scx)&255; }
      const mapX=offX>>3, mapY=tileY>>3;
      const tileNum=bus.mem[tmBase+mapY*32+mapX];
      let tileAddr;
      if(signed) tileAddr=0x9000+((tileNum<<24)>>24)*16;
      else tileAddr=0x8000+tileNum*16;
      const px=offX&7, py=tileY&7;
      const lo=bus.mem[tileAddr+py*2], hi=bus.mem[tileAddr+py*2+1];
      const bit=7-px;
      const color=((lo>>bit)&1)|(((hi>>bit)&1)<<1);
      this.framebuffer[y*160+x]=(bgp>>(color*2))&3;
    }
    if(winEnabled) this.windowLine++;
  }
  renderSprites(bus){
    const lcdc=bus.mem[0xFF40];
    if((lcdc&0x80)===0) return;          // LCD 关着
    if((lcdc&0x02)===0) return;          // bit1=OBJ 使能关着
    const y=this.ly;
    const size=(lcdc&0x04)?16:8;         // bit2=8×16
    for(let sp=0;sp<40;sp++){
      const base=0xFE00+sp*4;
      // OAM 存的坐标 = 屏幕左上角 + 偏移（X+8、Y+16），要减回来才是真屏幕位置
      const screenY=bus.mem[base]-16;
      const screenX=bus.mem[base+1]-8;
      const tile=bus.mem[base+2];
      const attr=bus.mem[base+3];
      if(y<screenY || y>=screenY+size) continue;
      let py=y-screenY;
      if(attr&0x40) py=(size-1)-py;      // Y 翻转
      for(let x=0;x<160;x++){
        if(x<screenX || x>=screenX+8) continue;
        let px=x-screenX;
        if(attr&0x20) px=7-px;           // X 翻转
        const tileAddr=0x8000+tile*16;
        const lo=bus.mem[tileAddr+py*2], hi=bus.mem[tileAddr+py*2+1];
        const bit=7-px;
        const color=((lo>>bit)&1)|(((hi>>bit)&1)<<1);
        if(color===0) continue;          // 色号0=透明
        const palette=(attr&0x10)?bus.mem[0xFF49]:bus.mem[0xFF48];
        this.framebuffer[y*160+x]=(palette>>(color*2))&3;
      }
    }
  }
}

class Cpu {
  constructor(){ this.reg=new Registers(); this.pc=0x0100; this.sp=0xFFFE; this.halted=false; this.ime=false; }
  fetch8(bus){ const v=bus.read(this.pc); this.pc=(this.pc+1)&0xFFFF; return v; }
  fetch16(bus){ const lo=this.fetch8(bus), hi=this.fetch8(bus); return (hi<<8)|lo; }
  push(bus,v){ this.sp=(this.sp-2)&0xFFFF; bus.write16(this.sp,v); }
  pop(bus){ const v=bus.read16(this.sp); this.sp=(this.sp+2)&0xFFFF; return v; }
  getR(bus,i){ return i===6?bus.read(this.reg.hl()):this.reg.get(i); }
  setR(bus,i,v){ if(i===6)bus.write(this.reg.hl(),v); else this.reg.set(i,v); }
  alu(kind,v){
    const a=this.reg.a, cin=this.reg.flag(FLAG_C)?1:0;
    switch(kind){
      case 0: case 1:{
        const sum=a+v+(kind===1?cin:0);
        this.reg.set_flag(FLAG_H,(a&0xF)+(v&0xF)+(kind===1?cin:0)>0xF);
        this.reg.a=sum&0xFF;
        this.reg.set_flag(FLAG_Z,this.reg.a===0);
        this.reg.set_flag(FLAG_N,false);
        this.reg.set_flag(FLAG_C,sum>0xFF);
        break;
      }
      case 2: case 3:{
        const sub=v+(kind===3?cin:0);
        const diff=a-sub;
        this.reg.set_flag(FLAG_H,(a&0xF)<(v&0xF)+(kind===3?cin:0));
        this.reg.a=diff&0xFF;
        this.reg.set_flag(FLAG_Z,this.reg.a===0);
        this.reg.set_flag(FLAG_N,true);
        this.reg.set_flag(FLAG_C,diff<0);
        break;
      }
      case 4: this.reg.a=a&v; this.reg.set_flag(FLAG_Z,this.reg.a===0); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,true); this.reg.set_flag(FLAG_C,false); break;
      case 5: this.reg.a=a^v; this.reg.set_flag(FLAG_Z,this.reg.a===0); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,false); break;
      case 6: this.reg.a=a|v; this.reg.set_flag(FLAG_Z,this.reg.a===0); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,false); break;
      case 7:{
        const diff=a-v;
        this.reg.set_flag(FLAG_H,(a&0xF)<(v&0xF));
        this.reg.set_flag(FLAG_Z,(diff&0xFF)===0);
        this.reg.set_flag(FLAG_N,true);
        this.reg.set_flag(FLAG_C,diff<0);
        break;
      }
    }
  }
  inc8(v){ const r=(v+1)&0xFF; this.reg.set_flag(FLAG_Z,r===0); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,(v&0xF)+1>0xF); return r; }
  dec8(v){ const r=(v-1)&0xFF; this.reg.set_flag(FLAG_Z,r===0); this.reg.set_flag(FLAG_N,true); this.reg.set_flag(FLAG_H,(v&0xF)===0); return r; }
  cond(cc){ switch(cc){case 0:return !this.reg.flag(FLAG_Z);case 1:return this.reg.flag(FLAG_Z);case 2:return !this.reg.flag(FLAG_C);case 3:return this.reg.flag(FLAG_C);} }
  stepCb(bus){
    const op=this.fetch8(bus);
    const i=op&7, v=this.getR(bus,i), kind=op>>3;
    const cycles=i===6?16:8;
    if(kind<8){
      const cin=this.reg.flag(FLAG_C)?1:0;
      let r,cout;
      switch(kind){
        case 0: r=((v<<1)|(v>>7))&0xFF; cout=v>>7; break;
        case 1: r=((v>>1)|(v<<7))&0xFF; cout=v&1; break;
        case 2: r=((v<<1)|cin)&0xFF; cout=v>>7; break;
        case 3: r=((v>>1)|(cin<<7))&0xFF; cout=v&1; break;
        case 4: r=(v<<1)&0xFF; cout=v>>7; break;
        case 5: r=((v>>1)|(v&0x80))&0xFF; cout=v&1; break;
        case 6: r=((v<<4)|(v>>4))&0xFF; cout=0; break;
        case 7: r=v>>1; cout=v&1; break;
      }
      this.setR(bus,i,r);
      this.reg.set_flag(FLAG_Z,r===0);
      this.reg.set_flag(FLAG_N,false);
      this.reg.set_flag(FLAG_H,false);
      this.reg.set_flag(FLAG_C,cout!==0);
    }else{
      const bit=(kind-8)&7;
      switch(kind>>3){
        case 1: this.reg.set_flag(FLAG_Z,(v&(1<<bit))===0); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,true); return i===6?12:8;
        case 2: this.setR(bus,i,v&~(1<<bit)); break;
        case 3: this.setR(bus,i,v|(1<<bit)); break;
      }
    }
    return cycles;
  }
  checkInterrupts(bus){
    const pending=bus.read(0xFFFF)&bus.read(0xFF0F)&0x1F;
    if(pending===0) return 0;
    if(this.halted) this.halted=false;
    if(!this.ime) return 0;
    for(let bit=0;bit<5;bit++){
      if(pending&(1<<bit)){
        this.ime=false;
        bus.write(0xFF0F,bus.read(0xFF0F)&~(1<<bit));
        this.push(bus,this.pc);
        this.pc=0x0040+bit*8;
        return 20;
      }
    }
    return 0;
  }
  step(bus){
    if(this.halted){ bus.tick(4); return 4+this.checkInterrupts(bus); }
    const op=this.fetch8(bus);
    let t;
    switch(op){
      case 0x00: t=4; break;
      case 0x10: this.fetch8(bus); t=4; break;
      case 0x76: this.halted=true; t=4; break;
      case 0xF3: this.ime=false; t=4; break;
      case 0xFB: this.ime=true; t=4; break;
      case 0x01: this.reg.set_bc(this.fetch16(bus)); t=12; break;
      case 0x11: this.reg.set_de(this.fetch16(bus)); t=12; break;
      case 0x21: this.reg.set_hl(this.fetch16(bus)); t=12; break;
      case 0x31: this.sp=this.fetch16(bus); t=12; break;
      case 0x02: bus.write(this.reg.bc(),this.reg.a); t=8; break;
      case 0x12: bus.write(this.reg.de(),this.reg.a); t=8; break;
      case 0x0A: this.reg.a=bus.read(this.reg.bc()); t=8; break;
      case 0x1A: this.reg.a=bus.read(this.reg.de()); t=8; break;
      case 0x22:{ const hl=this.reg.hl(); bus.write(hl,this.reg.a); this.reg.set_hl((hl+1)&0xFFFF); t=8; break; }
      case 0x32:{ const hl=this.reg.hl(); bus.write(hl,this.reg.a); this.reg.set_hl((hl-1)&0xFFFF); t=8; break; }
      case 0x2A:{ const hl=this.reg.hl(); this.reg.a=bus.read(hl); this.reg.set_hl((hl+1)&0xFFFF); t=8; break; }
      case 0x3A:{ const hl=this.reg.hl(); this.reg.a=bus.read(hl); this.reg.set_hl((hl-1)&0xFFFF); t=8; break; }
      case 0x09: case 0x19: case 0x29: case 0x39:{
        const rr=[this.reg.bc(),this.reg.de(),this.reg.hl(),this.sp][(op>>4)&3];
        const hl=this.reg.hl(), sum=hl+rr;
        this.reg.set_flag(FLAG_N,false);
        this.reg.set_flag(FLAG_H,(hl&0xFFF)+(rr&0xFFF)>0xFFF);
        this.reg.set_flag(FLAG_C,sum>0xFFFF);
        this.reg.set_hl(sum&0xFFFF); t=8; break;
      }
      case 0x03: this.reg.set_bc((this.reg.bc()+1)&0xFFFF); t=8; break;
      case 0x13: this.reg.set_de((this.reg.de()+1)&0xFFFF); t=8; break;
      case 0x23: this.reg.set_hl((this.reg.hl()+1)&0xFFFF); t=8; break;
      case 0x33: this.sp=(this.sp+1)&0xFFFF; t=8; break;
      case 0x0B: this.reg.set_bc((this.reg.bc()-1)&0xFFFF); t=8; break;
      case 0x1B: this.reg.set_de((this.reg.de()-1)&0xFFFF); t=8; break;
      case 0x2B: this.reg.set_hl((this.reg.hl()-1)&0xFFFF); t=8; break;
      case 0x3B: this.sp=(this.sp-1)&0xFFFF; t=8; break;
      case 0x04: case 0x0C: case 0x14: case 0x1C: case 0x24: case 0x2C: case 0x34: case 0x3C:{
        const i=(op>>3)&7, v=this.getR(bus,i);
        this.setR(bus,i,this.inc8(v)); t=i===6?12:4; break;
      }
      case 0x05: case 0x0D: case 0x15: case 0x1D: case 0x25: case 0x2D: case 0x35: case 0x3D:{
        const i=(op>>3)&7, v=this.getR(bus,i);
        this.setR(bus,i,this.dec8(v)); t=i===6?12:4; break;
      }
      case 0x06: case 0x0E: case 0x16: case 0x1E: case 0x26: case 0x2E: case 0x36: case 0x3E:{
        const i=(op>>3)&7, v=this.fetch8(bus);
        this.setR(bus,i,v); t=i===6?12:8; break;
      }
      case 0x07:{ const a=this.reg.a,c=a>>7; this.reg.a=((a<<1)|(a>>7))&0xFF; this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,c!==0); t=4; break; }
      case 0x0F:{ const a=this.reg.a,c=a&1; this.reg.a=((a>>1)|(a<<7))&0xFF; this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,c!==0); t=4; break; }
      case 0x17:{ const a=this.reg.a,cin=this.reg.flag(FLAG_C)?1:0; this.reg.a=((a<<1)|cin)&0xFF; this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,a>>7!==0); t=4; break; }
      case 0x1F:{ const a=this.reg.a,cin=this.reg.flag(FLAG_C)?1:0; this.reg.a=((a>>1)|(cin<<7))&0xFF; this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,a&1!==0); t=4; break; }
      case 0x27:{
        let a=this.reg.a, corr=0, cout=this.reg.flag(FLAG_C);
        if(!this.reg.flag(FLAG_N)){
          if(this.reg.flag(FLAG_H)||(a&0xF)>9) corr|=0x06;
          if(cout||a>0x99){ corr|=0x60; cout=true; }
          a=(a+corr)&0xFF;
        }else{
          if(this.reg.flag(FLAG_H)) corr|=0x06;
          if(cout) corr|=0x60;
          a=(a-corr)&0xFF;
        }
        this.reg.a=a;
        this.reg.set_flag(FLAG_Z,a===0);
        this.reg.set_flag(FLAG_H,false);
        this.reg.set_flag(FLAG_C,cout); t=4; break;
      }
      case 0x2F: this.reg.a=(~this.reg.a)&0xFF; this.reg.set_flag(FLAG_N,true); this.reg.set_flag(FLAG_H,true); t=4; break;
      case 0x37: this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,true); t=4; break;
      case 0x3F:{ const c=this.reg.flag(FLAG_C); this.reg.set_flag(FLAG_N,false); this.reg.set_flag(FLAG_H,false); this.reg.set_flag(FLAG_C,!c); t=4; break; }
      default:
        if(op>=0x40&&op<=0x7F){
          const dst=(op>>3)&7, src=op&7;
          this.setR(bus,dst,this.getR(bus,src)); t=(dst===6||src===6)?8:4;
        }else if(op>=0x80&&op<=0xBF){
          const kind=(op>>3)&7, v=this.getR(bus,op&7);
          this.alu(kind,v); t=(op&7)===6?8:4;
        }else switch(op){
          case 0xC1: this.reg.set_bc(this.pop(bus)); t=12; break;
          case 0xD1: this.reg.set_de(this.pop(bus)); t=12; break;
          case 0xE1: this.reg.set_hl(this.pop(bus)); t=12; break;
          case 0xF1: this.reg.set_af(this.pop(bus)); t=12; break;
          case 0xC5: this.push(bus,this.reg.bc()); t=16; break;
          case 0xD5: this.push(bus,this.reg.de()); t=16; break;
          case 0xE5: this.push(bus,this.reg.hl()); t=16; break;
          case 0xF5: this.push(bus,this.reg.af()); t=16; break;
          case 0xC2: case 0xCA: case 0xD2: case 0xDA:{
            const a=this.fetch16(bus);
            if(this.cond((op>>3)&3)){ this.pc=a; t=16; }else t=12; break;
          }
          case 0xC3: this.pc=this.fetch16(bus); t=16; break;
          case 0xE9: this.pc=this.reg.hl(); t=4; break;
          case 0xC4: case 0xCC: case 0xD4: case 0xDC:{
            const a=this.fetch16(bus);
            if(this.cond((op>>3)&3)){ this.push(bus,this.pc); this.pc=a; t=24; }else t=12; break;
          }
          case 0xCD:{ const a=this.fetch16(bus); this.push(bus,this.pc); this.pc=a; t=24; break; }
          case 0xC0: case 0xC8: case 0xD0: case 0xD8:{
            if(this.cond((op>>3)&3)){ this.pc=this.pop(bus); t=20; }else t=8; break;
          }
          case 0xC9: this.pc=this.pop(bus); t=16; break;
          case 0xD9: this.pc=this.pop(bus); this.ime=true; t=16; break;
          case 0xC7: case 0xCF: case 0xD7: case 0xDF: case 0xE7: case 0xEF: case 0xF7: case 0xFF:
            this.push(bus,this.pc); this.pc=op&0x38; t=16; break;
          case 0xC6: case 0xCE: case 0xD6: case 0xDE: case 0xE6: case 0xEE: case 0xF6: case 0xFE:{
            const kind=(op>>3)&7, v=this.fetch8(bus);
            this.alu(kind,v); t=8; break;
          }
          case 0x18:{ const off=this.fetch8(bus); this.pc=(this.pc+((off<<24)>>24))&0xFFFF; t=12; break; }
          case 0x20: case 0x28: case 0x30: case 0x38:{
            const off=this.fetch8(bus);
            if(this.cond((op>>3)&3)){ this.pc=(this.pc+((off<<24)>>24))&0xFFFF; t=12; }else t=8; break;
          }
          case 0xE0:{ const n=this.fetch8(bus); bus.write(0xFF00+n,this.reg.a); t=12; break; }
          case 0xF0:{ const n=this.fetch8(bus); this.reg.a=bus.read(0xFF00+n); t=12; break; }
          case 0xE2: bus.write(0xFF00+this.reg.c,this.reg.a); t=8; break;
          case 0xF2: this.reg.a=bus.read(0xFF00+this.reg.c); t=8; break;
          case 0xEA:{ const a16=this.fetch16(bus); bus.write(a16,this.reg.a); t=16; break; }
          case 0xFA:{ const a16=this.fetch16(bus); this.reg.a=bus.read(a16); t=16; break; }
          case 0x08:{ const a16=this.fetch16(bus); bus.write16(a16,this.sp); t=20; break; }
          case 0xF9: this.sp=this.reg.hl(); t=8; break;
          case 0xE8:{
            const n=this.fetch8(bus), sn=(n<<24)>>24;
            const lo=this.sp&0xFF;
            this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false);
            this.reg.set_flag(FLAG_H,(lo&0xF)+(n&0xF)>0xF);
            this.reg.set_flag(FLAG_C,lo+n>0xFF);
            this.sp=(this.sp+sn)&0xFFFF; t=16; break;
          }
          case 0xF8:{
            const n=this.fetch8(bus), sn=(n<<24)>>24;
            const lo=this.sp&0xFF;
            this.reg.set_flag(FLAG_Z,false); this.reg.set_flag(FLAG_N,false);
            this.reg.set_flag(FLAG_H,(lo&0xF)+(n&0xF)>0xF);
            this.reg.set_flag(FLAG_C,lo+n>0xFF);
            this.reg.set_hl((this.sp+sn)&0xFFFF); t=12; break;
          }
          case 0xCB: t=this.stepCb(bus); break;
          default: t=4;
        }
    }
    bus.tick(t);
    const it=this.checkInterrupts(bus);
    return t+it;
  }
}

/* ================= 网页外壳 ================= */
const cvs=document.getElementById("screen"), ctx=cvs.getContext("2d");
const SCALE=4, W=160*SCALE, H=144*SCALE;
const PALETTE=[0xE0F8D0,0x88C070,0x346856,0x081820];
const imgData=ctx.createImageData(W,H);

let bus,cpu,ppu,running=false,romData=null;
let lastT=0,fpsN=0,fpsAcc=0;

const $=id=>document.getElementById(id);

function hexToRgb(h){ return [(h>>16)&255,(h>>8)&255,h&255]; }

function render(){
  for(let y=0;y<144;y++)for(let x=0;x<160;x++){
    const c=hexToRgb(PALETTE[ppu.framebuffer[y*160+x]]);
    for(let sy=0;sy<SCALE;sy++)for(let sx=0;sx<SCALE;sx++){
      const idx=((y*SCALE+sy)*W+x*SCALE+sx)*4;
      imgData.data[idx]=c[0]; imgData.data[idx+1]=c[1]; imgData.data[idx+2]=c[2]; imgData.data[idx+3]=255;
    }
  }
  ctx.putImageData(imgData,0,0);
}

function loop(t){
  if(!running) return;
  const dt=t-lastT; lastT=t;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>500){ $("fpsV").textContent=Math.round(1000/(fpsAcc/fpsN)); fpsAcc=0; fpsN=0; }
  let spent=0;
  while(spent<70224){
    const t=cpu.step(bus);
    ppu.tick(t,bus);
    spent+=t;
  }
  render();
  requestAnimationFrame(loop);
}

// 从 ROM 头 0x134~0x143 取游戏标题，做存档键（同款游戏读回同一份存档）
function romTitle(rom){
  let s="";
  for(let i=0x134;i<0x144;i++){ const c=rom[i]||0; if(c===0)break; s+=String.fromCharCode(c); }
  return s.replace(/[^A-Za-z0-9]/g,"").toLowerCase();
}

function startGame(rom){
  bus=new Bus(); bus.loadRom(rom);
  // SRAM 存档：有存档空间（卡带头 0x149 非 0）才读写 localStorage
  const key="gbem-sram-"+romTitle(rom);
  if(bus.ram.length>0){
    try{
      const saved=localStorage.getItem(key);
      if(saved){ const arr=saved.split(",").map(Number); if(arr.length===bus.ram.length) bus.ram.set(arr); }
    }catch(e){}
  }
  cpu=new Cpu(); ppu=new Ppu();
  running=true;
  $("statusV").textContent="运行中";
  $("overlay").classList.add("hidden");
  lastT=performance.now();
  // 每 2 秒自动落盘一次（游戏没存档空间就跳过）
  if(bus.ram.length>0){
    const saveKey=key;
    setInterval(()=>{ try{ localStorage.setItem(saveKey,Array.from(bus.ram).join(",")); }catch(e){} },2000);
  }
  requestAnimationFrame(loop);
}


$("btnLoad").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>startGame(new Uint8Array(r.result));
  r.readAsArrayBuffer(f);
});

function b64toRom(b64){const bin=atob(b64);const rom=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)rom[i]=bin.charCodeAt(i);return rom;}
for(const btn of document.querySelectorAll("[data-game]")){btn.addEventListener("click",()=>startGame(b64toRom(ROMS_B64[btn.dataset.game])));}
const keyMap={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",x:"a",z:"b",Enter:"start"," ":"start",Shift:"select"};
document.addEventListener("keydown",e=>{
  if(!running) return;
  const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];
  if(!k) return;
  e.preventDefault();
  if(k==="up") bus.joypad_dir&=~0x04;
  else if(k==="down") bus.joypad_dir&=~0x08;
  else if(k==="left") bus.joypad_dir&=~0x02;
  else if(k==="right") bus.joypad_dir&=~0x01;
  else if(k==="a") bus.joypad_btn&=~0x01;
  else if(k==="b") bus.joypad_btn&=~0x02;
  else if(k==="select") bus.joypad_btn&=~0x04;
  else if(k==="start") bus.joypad_btn&=~0x08;
});
document.addEventListener("keyup",e=>{
  if(!running) return;
  const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];
  if(!k) return;
  if(k==="up") bus.joypad_dir|=0x04;
  else if(k==="down") bus.joypad_dir|=0x08;
  else if(k==="left") bus.joypad_dir|=0x02;
  else if(k==="right") bus.joypad_dir|=0x01;
  else if(k==="a") bus.joypad_btn|=0x01;
  else if(k==="b") bus.joypad_btn|=0x02;
  else if(k==="select") bus.joypad_btn|=0x04;
  else if(k==="start") bus.joypad_btn|=0x08;
});

/* 触屏 */
for(const btn of document.querySelectorAll("[data-key]")){
  const k=btn.dataset.key;
  const on=e=>{ e.preventDefault(); if(!running)return;
    if(k==="up") bus.joypad_dir&=~0x04;
    else if(k==="down") bus.joypad_dir&=~0x08;
    else if(k==="left") bus.joypad_dir&=~0x02;
    else if(k==="right") bus.joypad_dir&=~0x01;
    else if(k==="a") bus.joypad_btn&=~0x01;
    else if(k==="b") bus.joypad_btn&=~0x02;
    else if(k==="start") bus.joypad_btn&=~0x08;
  };
  const off=e=>{ e.preventDefault(); if(!running)return;
    if(k==="up") bus.joypad_dir|=0x04;
    else if(k==="down") bus.joypad_dir|=0x08;
    else if(k==="left") bus.joypad_dir|=0x02;
    else if(k==="right") bus.joypad_dir|=0x01;
    else if(k==="a") bus.joypad_btn|=0x01;
    else if(k==="b") bus.joypad_btn|=0x02;
    else if(k==="start") bus.joypad_btn|=0x08;
  };
  btn.addEventListener("pointerdown",on);
  btn.addEventListener("pointerup",off);
  btn.addEventListener("pointerleave",off);
  btn.addEventListener("pointercancel",off);
}
</script>
