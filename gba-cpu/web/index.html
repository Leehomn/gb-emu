<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060f">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./player.css">
  <script type="module" src="./player.js"></script>
  <title>GBA 播放器 · RustBoy</title>
</head>
<body>
  <canvas id="matrix-bg" aria-hidden="true"></canvas>
  <div class="site-bar">
    <nav aria-label="站点导航">
      <a class="brand" href="../../">RustBoy</a>
      <a href="../../#play">返回游玩区</a>
      <a href="https://github.com/Leehomn/gb-emu/blob/master/gba-cpu/README.md">GBA 文档</a>
      <button id="rain-toggle" type="button" aria-pressed="true" aria-label="切换背景代码雨">RAIN: ON</button>
    </nav>
  </div>
  <main>
    <header>
      <h1>GBA 播放器</h1>
      <p id="status" role="status">正在加载模拟器……</p>
    </header>
    <section class="game" aria-label="游戏">
      <canvas id="screen" width="240" height="160" tabindex="0" aria-label="GBA 游戏画面"></canvas>
      <div class="actions">
        <button id="open" type="button" disabled>选择卡带</button>
        <input id="rom" type="file" accept=".gba,.bin" hidden>
        <button id="pause" disabled>暂停</button>
        <button id="sound" aria-pressed="false" disabled>开启声音</button>
      </div>
      <div class="controls" aria-label="触屏按键">
        <button data-key="9" aria-label="L 肩键">L</button>
        <button data-key="8" aria-label="R 肩键">R</button>
        <button data-key="6" aria-label="上">↑</button>
        <button data-key="7" aria-label="下">↓</button>
        <button data-key="5" aria-label="左">←</button>
        <button data-key="4" aria-label="右">→</button>
        <button data-key="1">B</button>
        <button data-key="0">A</button>
        <button data-key="2">Select</button>
        <button data-key="3">Start</button>
      </div>
    </section>
    <aside>
      <h2>卡带设置</h2>
      <label for="bios">BIOS（可选，下次载入卡带时使用）</label>
      <input id="bios" type="file" accept=".bin">
      <div class="save">
        <button id="import" disabled>导入存档</button>
        <input id="save-file" type="file" accept=".sav,.bin" hidden>
        <button id="export" disabled>导出存档</button>
      </div>
      <p id="save-status" role="status">存档保留在当前浏览器。</p>
      <h2>键盘操作</h2>
      <dl>
        <div><dt>方向</dt><dd>方向键</dd></div>
        <div><dt>A / B</dt><dd>Z / X</dd></div>
        <div><dt>L / R</dt><dd>A / S</dd></div>
        <div><dt>Start / Select</dt><dd>回车 / 右 Shift</dd></div>
      </dl>
    </aside>
  </main>
<script>
/* 背景代码雨独立运行，不接入模拟器逻辑。 */
(function () {
  'use strict';
  const canvas = document.getElementById('matrix-bg');
  const button = document.getElementById('rain-toggle');
  const ctx = canvas.getContext('2d');
  if (!ctx) { button.hidden = true; return; }
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF';
  let enabled = true, raf = 0, last = 0, width = 0, height = 0, size = 18, drops = [];
  try { enabled = localStorage.getItem('rustboy-matrix-rain') !== 'off'; } catch (_) { /* 隐私模式下使用默认值 */ }
  function symbol() { return Math.random() < .003 ? ['LD', 'IRQ', 'DMA'][Math.floor(Math.random()*3)] : glyphs[Math.floor(Math.random()*glyphs.length)]; }
  function paint(still) {
    ctx.fillStyle = still ? '#07060f' : 'rgba(7,6,15,.09)';
    ctx.fillRect(0, 0, width, height);
    ctx.font = size + 'px ui-monospace, Consolas, monospace';
    drops.forEach(function (drop, i) {
      const x = i * size, y = drop.y;
      if (still) {
        for (let j = 1; j < 13; j++) {
          ctx.fillStyle = 'rgba(0,255,136,' + (.34 * (1-j/13)) + ')';
          ctx.fillText(symbol(), x, y-j*size);
        }
      }
      ctx.fillStyle = i % 47 === 0 ? '#ff2ea6' : i % 29 === 0 ? '#00f0ff' : '#14f195';
      ctx.fillText(symbol(), x, y-size);
      ctx.fillStyle = i % 3 === 0 ? '#00f0ff' : '#d8fff4';
      ctx.fillText(symbol(), x, y);
      if (!still) { drop.y += size * drop.speed; if (drop.y > height + size*15 && Math.random() > .975) drop.y = -size; }
    });
  }
  function tick(time) {
    raf = 0;
    if (!enabled || document.hidden || motion.matches) return;
    if (time-last >= 50) { paint(false); last = time; }
    raf = requestAnimationFrame(tick);
  }
  function sync() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    button.textContent = 'RAIN: ' + (enabled ? 'ON' : 'OFF');
    button.setAttribute('aria-pressed', String(enabled));
    canvas.hidden = !enabled;
    if (enabled && !document.hidden) { if (motion.matches) paint(true); else raf = requestAnimationFrame(tick); }
  }
  function resize() {
    width = window.innerWidth; height = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = width < 600 ? 20 : 18;
    drops = Array.from({length: Math.ceil(width/size)}, function () { return { y: Math.random()*height, speed: .35+Math.random()*.65 }; });
    ctx.clearRect(0, 0, width, height);
    sync();
  }
  button.addEventListener('click', function () {
    enabled = !enabled;
    try { localStorage.setItem('rustboy-matrix-rain', enabled ? 'on' : 'off'); } catch (_) { /* 存储不可用时仍可切换 */ }
    sync();
  });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', sync);
  motion.addEventListener('change', sync);
  resize();
})();
</script>
</body>
</html>
